name: synth-benchmark

# Issue #55: P1 (SynMeter, real single-table) + P2 (ogagila FK) + Case A.
# Weekly cron runs P1-adult only (zero external services — D6);
# Case A / P2 need the ogagila checkout, so they run on workflow_dispatch
# and only when the repo variable OGAGILA_DIR (ogagila git URL) is set.
# Gates inside run_p1.sh / run_p2.sh / run_case_a.sh decide job success.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1

jobs:
  p1-adult:
    name: p1-synmeter-adult
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: echo "version=$(rustc --version)" >> $GITHUB_OUTPUT
        id: rust-version
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/index
          key: index-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            index-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/cache
          key: registry-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fetch
      - uses: actions/cache@v4
        with:
          path: target
          key: p1-target-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: tests/benchmark/requirements.txt
      - name: Install benchmark Python deps
        run: pip install -r tests/benchmark/requirements.txt
      - name: Cache UCI Adult download
        uses: actions/cache@v4
        with:
          path: tests/benchmark/p1/data
          key: adult-${{ hashFiles('tests/benchmark/p1/prep_adult.py') }}
      - name: Run P1 benchmark (gates decide outcome)
        run: tests/benchmark/p1/run_p1.sh
      - name: Upload P1 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-report
          path: |
            tests/benchmark/p1/REPORT.md
            tests/benchmark/p1/*.json

  case-a:
    name: case-a-pagila
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' && vars.OGAGILA_DIR != ''
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: echo "version=$(rustc --version)" >> $GITHUB_OUTPUT
        id: rust-version
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/index
          key: index-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            index-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/cache
          key: registry-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fetch
      - uses: actions/cache@v4
        with:
          path: target
          key: casea-target-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: tests/benchmark/requirements.txt
      - name: Install benchmark Python deps
        run: pip install -r tests/benchmark/requirements.txt
      - name: Run Case A benchmark (gates decide outcome)
        env:
          OGAGILA_DIR: /tmp/ogagila
        run: |
          git clone --depth 1 "${{ vars.OGAGILA_DIR }}" /tmp/ogagila
          tests/benchmark/run_case_a.sh
      - name: Upload Case A report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: case-a-report
          path: |
            tests/benchmark/case_a_report.md
            tests/benchmark/case_a_report.json

  p2-ogagila:
    name: p2-fk-pagila
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' && vars.OGAGILA_DIR != ''
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: echo "version=$(rustc --version)" >> $GITHUB_OUTPUT
        id: rust-version
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/index
          key: index-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            index-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/cache
          key: registry-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fetch
      - uses: actions/cache@v4
        with:
          path: target
          key: p2-target-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: tests/benchmark/requirements.txt
      - name: Install benchmark Python deps
        run: pip install -r tests/benchmark/requirements.txt
      - name: Run P2 benchmark (gates decide outcome)
        env:
          OGAGILA_DIR: /tmp/ogagila
        run: |
          git clone --depth 1 "${{ vars.OGAGILA_DIR }}" /tmp/ogagila
          tests/benchmark/p2/run_p2.sh
      - name: Upload P2 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-report
          path: |
            tests/benchmark/p2/REPORT.md
            tests/benchmark/p2/*.json
