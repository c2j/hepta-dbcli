name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1

jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: echo "version=$(rustc --version)" >> $GITHUB_OUTPUT
        id: rust-version
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/index
          key: index-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            index-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/cache
          key: registry-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fetch
      - uses: actions/cache@v4
        with:
          path: target
          key: clippy-target-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo clippy --all --all-targets
      - run: cargo clippy --all --all-targets --features synth

  duckdb:
    name: duckdb
    # The DuckDB backend is only compiled under `--features duckdb`, and its
    # bundled C++ core is heavy, so it gets its own job instead of slowing the
    # default clippy/test matrix. Without this job a change to the backend
    # traits (DbConn / QueryResult / BackendFactory) can break the DuckDB
    # backend while every other check stays green.
    runs-on: ubuntu-latest
    # A cold cache has to build the bundled DuckDB C++ core and takes ~30 min;
    # warm runs (same rustc + Cargo.lock, restored from `duckdb-target-*`) are
    # a few minutes. The headroom matters because a cold run otherwise lands
    # within seconds of the limit.
    timeout-minutes: 60
    env:
      # The bundled DuckDB C++ build is memory hungry; keep parallelism low.
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: echo "version=$(rustc --version)" >> $GITHUB_OUTPUT
        id: rust-version
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/index
          key: index-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            index-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/cache
          key: registry-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fetch
      - uses: actions/cache@v4
        with:
          path: target
          key: duckdb-target-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo clippy --all --all-targets --features duckdb
      - run: cargo test --all --features duckdb
      - run: cargo test --features "duckdb,integration" --test regress_duckdb
      # Issue #98: end-to-end load tests (drive the real binary against the
      # embedded DuckDB file; MySQL part self-skips without its env var).
      - run: cargo test --features "duckdb,integration" --test regress_load
      - run: cargo test --features "duckdb,integration" --test regress_inline_url

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: testdb
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -ptestpass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: echo "version=$(rustc --version)" >> $GITHUB_OUTPUT
        id: rust-version
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/index
          key: index-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            index-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/cache
          key: registry-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fetch
      - uses: actions/cache@v4
        with:
          path: target
          key: test-target-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Setup test user
        run: |
          docker exec ${{ job.services.mysql.id }} mysql -u root -ptestpass -e "
            CREATE USER 'mcp'@'%' IDENTIFIED WITH caching_sha2_password BY 'testpass';
            GRANT ALL PRIVILEGES ON *.* TO 'mcp'@'%';
            FLUSH PRIVILEGES;
          "
      - run: cargo test --all
      - run: cargo test --all --features synth
      - run: cargo test --all --features integration
        env:
          HEPTA_DBCLI_TEST_URL: mysql://mcp:testpass@127.0.0.1:3306/testdb
      # Issue #98: load end-to-end tests. The duckdb job runs the DuckDB-file
      # module; this job runs the MySQL module (integration-gated) against the
      # service container.
      - run: cargo test --features integration --test regress_load
        env:
          HEPTA_DBCLI_TEST_URL: mysql://mcp:testpass@127.0.0.1:3306/testdb
      # Real-database acceptance for the synth M1 work (#62-#65): trains on a
      # fixture with datetimes / decimals / NULLs / FKs, generates in every
      # export format and asserts the artifacts with tests/synth-verify.
      - name: synth M1 end-to-end verification
        run: bash tests/synth-verify/run_m1.sh
        env:
          HEPTA_DBCLI_TEST_URL: mysql://mcp:testpass@127.0.0.1:3306/testdb
          SYNTH_E2E_MYSQL_CMD: docker exec -i ${{ job.services.mysql.id }} mysql -uroot -ptestpass -D testdb
      # Real-database acceptance for the synth M2 work (#66 ECDF marginal
      # auto-selection, #67 holdout baseline + `synth report`): trains,
      # generates twice, scores offline and against the live key pools, and
      # checks degradation detection, determinism and honest skips.
      - name: synth M2 end-to-end verification
        run: bash tests/synth-verify/run_m2.sh
        env:
          HEPTA_DBCLI_TEST_URL: mysql://mcp:testpass@127.0.0.1:3306/testdb
          SYNTH_E2E_MYSQL_CMD: docker exec -i ${{ job.services.mysql.id }} mysql -uroot -ptestpass -D testdb
      # Real-database acceptance for the synth primary-key fix (#82): SQL
      # export must round-trip through MySQL with unique single keys and
      # composite tuples (extrapolating a bounded numeric key), while a
      # non-extendable key set fails fast and names the column and row count.
      - name: synth pk-uniqueness end-to-end verification
        run: bash tests/synth-verify/run_m4_pk.sh
        env:
          HEPTA_DBCLI_TEST_URL: mysql://mcp:testpass@127.0.0.1:3306/testdb
          SYNTH_E2E_MYSQL_CMD: docker exec -i ${{ job.services.mysql.id }} mysql -uroot -ptestpass -D testdb
      # Real-database acceptance for the synth child-cardinality work (#72):
      # the learned rows-per-parent distribution survives into the model, a
      # `cardinality: modeled` generate reproduces its shape (TV < 0.1) with
      # FK integrity, and the default keeps `--rows`.
      - name: synth cardinality end-to-end verification
        run: bash tests/synth-verify/run_m4_cardinality.sh
        env:
          HEPTA_DBCLI_TEST_URL: mysql://mcp:testpass@127.0.0.1:3306/testdb
          SYNTH_E2E_MYSQL_CMD: docker exec -i ${{ job.services.mysql.id }} mysql -uroot -ptestpass -D testdb
      # Real-database acceptance for the synth PII work (#71): recognized
      # columns lose their values from both the model and the profile, the
      # generated values are format-valid fakes, stable mapping and
      # `sdtype: keep` behave, and the run is deterministic.
      - name: synth PII end-to-end verification
        run: bash tests/synth-verify/run_m4_pii.sh
        env:
          HEPTA_DBCLI_TEST_URL: mysql://mcp:testpass@127.0.0.1:3306/testdb
          SYNTH_E2E_MYSQL_CMD: docker exec -i ${{ job.services.mysql.id }} mysql -uroot -ptestpass -D testdb
